<svg xmlns="http://www.w3.org/2000/svg" width="640" height="686" viewBox="0 0 640 686" role="img" aria-label="Festival poster, Winter Builds. Coming soon: RAGBench: An open-source harness for evaluating RAG pipelines; Grounded Policy Assistant: Agentic RAG over public US regulatory documents, with cited answers and refusals; Market Intelligence Platform: An event-driven, multi-agent research copilot for market intelligence. Already out: agentic-rag-service, capability-runtime, payments-data-platform, medicare-claims-analytics, kafka-databricks-nasa."><title>Festival poster, Winter Builds. Coming soon: RAGBench: An open-source harness for evaluating RAG pipelines; Grounded Policy Assistant: Agentic RAG over public US regulatory documents, with cited answers and refusals; Market Intelligence Platform: An event-driven, multi-agent research copilot for market intelligence. Already out: agentic-rag-service, capability-runtime, payments-data-platform, medicare-claims-analytics, kafka-databricks-nasa.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#e6edf3}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.muted{fill:#8b949e}@keyframes sway{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}.beam{transform-box:view-box;animation:sway 9s ease-in-out infinite}@keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}.soon{animation:blink 2.4s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.beam,.soon{animation:none}}</style><rect width="640" height="686" rx="12" fill="#0d1117"/><clipPath id="frame"><rect width="640" height="686" rx="12"/></clipPath><g clip-path="url(#frame)"><g class="beam" style="transform-origin:128px 0px;animation-delay:0s"><polygon points="122,0 134,0 268,686 -12,686" fill="#2dd4bf" opacity=".07"/></g><g class="beam" style="transform-origin:320px 0px;animation-delay:-3s"><polygon points="314,0 326,0 460,686 180,686" fill="#a371f7" opacity=".07"/></g><g class="beam" style="transform-origin:512px 0px;animation-delay:-6s"><polygon points="506,0 518,0 652,686 372,686" fill="#f472b6" opacity=".07"/></g></g><rect x="10" y="10" width="620" height="666" rx="8" fill="none" stroke="#8b949e" stroke-opacity=".3" stroke-dasharray="2 6"/><text x="320.0" y="58" text-anchor="middle" class="mono muted" style="font-size:12px;letter-spacing:4px">HARSHIT GADGE PRESENTS</text><text x="320.0" y="112" text-anchor="middle" style="font-size:40px;font-weight:900;letter-spacing:2px">WINTER BUILDS</text><text x="320.0" y="142" text-anchor="middle" class="muted" style="font-size:13px">New projects, built in the open over the holidays</text><text x="320.0" y="210" text-anchor="middle" style="font-size:22px;font-weight:800;letter-spacing:1px;fill:#2dd4bf">RAGBENCH</text><text x="320.0" y="230" text-anchor="middle" class="muted" style="font-size:12px">An open-source harness for evaluating RAG pipelines</text><g class="soon"><rect x="268.0" y="238" width="104" height="20" rx="10" fill="none" stroke="#2dd4bf"/><text x="320.0" y="252" text-anchor="middle" class="mono" style="font-size:10px;font-weight:700;letter-spacing:2px;fill:#2dd4bf">COMING SOON</text></g><text x="320.0" y="304" text-anchor="middle" style="font-size:22px;font-weight:800;letter-spacing:1px;fill:#a371f7">GROUNDED POLICY ASSISTANT</text><text x="320.0" y="324" text-anchor="middle" class="muted" style="font-size:12px">Agentic RAG over public US regulatory documents,</text><text x="320.0" y="344" text-anchor="middle" class="muted" style="font-size:12px">with cited answers and refusals</text><g class="soon"><rect x="268.0" y="352" width="104" height="20" rx="10" fill="none" stroke="#a371f7"/><text x="320.0" y="366" text-anchor="middle" class="mono" style="font-size:10px;font-weight:700;letter-spacing:2px;fill:#a371f7">COMING SOON</text></g><text x="320.0" y="418" text-anchor="middle" style="font-size:22px;font-weight:800;letter-spacing:1px;fill:#f472b6">MARKET INTELLIGENCE PLATFORM</text><text x="320.0" y="438" text-anchor="middle" class="muted" style="font-size:12px">An event-driven, multi-agent research copilot for</text><text x="320.0" y="458" text-anchor="middle" class="muted" style="font-size:12px">market intelligence</text><g class="soon"><rect x="268.0" y="466" width="104" height="20" rx="10" fill="none" stroke="#f472b6"/><text x="320.0" y="480" text-anchor="middle" class="mono" style="font-size:10px;font-weight:700;letter-spacing:2px;fill:#f472b6">COMING SOON</text></g><line x1="200.0" y1="514" x2="440.0" y2="514" stroke="#8b949e" stroke-opacity=".4"/><text x="320.0" y="540" text-anchor="middle" class="mono muted" style="font-size:11px;letter-spacing:3px">ALREADY OUT · THE SETLIST</text><text x="320.0" y="562" text-anchor="middle" class="mono" style="font-size:13px">1. agentic-rag-service</text><text x="320.0" y="584" text-anchor="middle" class="mono" style="font-size:13px">2. capability-runtime</text><text x="320.0" y="606" text-anchor="middle" class="mono" style="font-size:13px">3. payments-data-platform</text><text x="320.0" y="628" text-anchor="middle" class="mono" style="font-size:13px">4. medicare-claims-analytics</text><text x="320.0" y="650" text-anchor="middle" class="mono" style="font-size:13px">5. kafka-databricks-nasa</text></svg>

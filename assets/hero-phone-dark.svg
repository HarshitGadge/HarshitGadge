an><tspan class="acc2">assess   </tspan><tspan class="muted"> retry if coverage is weak</tspan></text></g><g class="h0"><text x="32" y="456" xml:space="preserve"><tspan class="grn">&#10003; answer</tspan><tspan class="muted">  extractive · cited excerpt</tspan></text></g><g class="a0_0"><text x="32" y="482" xml:space="preserve">The MERGE guards on `cdc_lsn &gt;</text></g><g class="a0_1"><text x="32" y="505" xml:space="preserve">target.cdc_lsn`, so a stale event re-applied</text></g><g class="a0_2"><text x="32" y="528" xml:space="preserve">after a newer one is ignored. [5]</text></g><g class="c0"><text x="32" y="556" class="sm"><tspan class="acc">[5]</tspan><tspan class="muted"> demo/corpus/payments-data-platform/README.md</tspan></text><text x="32" y="578" class="sm muted">live at agentic-rag-service-fxsc.onrender.com</text></g></g><g class="s1"><text x="32" y="266"><tspan class="acc">harshit@portfolio</tspan><tspan class="muted">:~$ </tspan></text><text x="32" y="290" xml:space="preserve">ask &quot;how are hospital readmissions defined</text><g clip-path="url(#tc)"><g class="q1_0"><rect x="32" y="274.5" width="401.0" height="24" fill="#010409"/><g class="k1_0"><rect class="cursor" x="32" y="277.0" width="9.0" height="17.0" fill="#2dd4bf"/></g></g></g><text x="32" y="314" xml:space="preserve">in the Medicare claims project?&quot;</text><g clip-path="url(#tc)"><g class="q1_1"><rect x="32" y="298.5" width="311.0" height="24" fill="#010409"/><g class="k1_1"><rect class="cursor" x="32" y="301.0" width="9.0" height="17.0" fill="#2dd4bf"/></g></g></g><g class="t1_0"><text x="32" y="348" xml:space="preserve"><tspan class="pur">&#9656; </tspan><tspan class="acc2">plan     </tspan><tspan class="muted"> split multi-part questions</tspan></text></g><g class="t1_1"><text x="32" y="372" xml:space="preserve"><tspan class="pur">&#9656; </tspan><tspan class="acc2">retrieve </tspan><tspan class="muted"> vector search, top-k 5</tspan></text></g><g class="t1_2"><text x="32" y="396" xml:space="preserve"><tspan class="pur">&#9656; </tspan><tspan class="acc2">fuse     </tspan><tspan class="muted"> reciprocal rank fusion</tspan></text></g><g class="t1_3"><text x="32" y="420" xml:space="preserve"><tspan class="pur">&#9656; </tspan><tspan class="acc2">assess   </tspan><tspan class="muted"> retry if coverage is weak</tspan></text></g><g class="h1"><text x="32" y="456" xml:space="preserve"><tspan class="grn">&#10003; answer</tspan><tspan class="muted">  extractive · cited excerpt</tspan></text></g><g class="a1_0"><text x="32" y="482" xml:space="preserve">**Readmissions:** an index stay is</text></g><g class="a1_1"><text x="32" y="505" xml:space="preserve">discharged alive with 30 days of follow-up</text></g><g class="a1_2"><text x="32" y="528" xml:space="preserve">left in the data, and a readmission is any</text></g><g class="a1_3"><text x="32" y="551" xml:space="preserve">stay starting 1–30 days later. [1]</text></g><g class="c1"><text x="32" y="579" class="sm"><tspan class="acc">[1]</tspan><tspan class="muted"> demo/corpus/medicare-claims-analytics/README.md</tspan></text><text x="32" y="601" class="sm muted">live at agentic-rag-service-fxsc.onrender.com</text></g></g><g class="s2"><text x="32" y="266"><tspan class="acc">harshit@portfolio</tspan><tspan class="muted">:~$ </tspan></text><text x="32" y="290" xml:space="preserve">ask &quot;how does capability-runtime replay a</text><g clip-path="url(#tc)"><g class="q2_0"><rect x="32" y="274.5" width="392.0" height="24" fill="#010409"/><g class="k2_0"><rect class="cursor" x="32" y="277.0" width="9.0" height="17.0" fill="#2dd4bf"/></g></g></g><text x="32" y="314" xml:space="preserve">workflow without calling a model?&quot;</text><g clip-path="url(#tc)"><g class="q2_1"><rect x="32" y="298.5" width="329.0" height="24" fill="#010409"/><g class="k2_1"><rect class="cursor" x="32" y="301.0" width="9.0" height="17.0" fill="#2dd4bf"/></g></g></g><g class="t2_0"><text x="32" y="348" xml:space="preserve"><tspan class="pur">&#9656; </tspan><tspan class="acc2">plan     </tspan><tspan class="muted"> split multi-part questions</tspan></text></g><g class="t2_1"><text x="32" y="372" xml:space="preserve"><tspan class="pur">&#9656; </tspan><tspan class="acc2">retrieve </tspan><tspan class="muted"> vector search, top-k 5</tspan></text></g><g class="t2_2"><text x="32" y="396" xml:space="preserve"><tspan class="pur">&#9656; </tspan><tspan class="acc2">fuse     </tspan><tspan class="muted"> reciprocal rank fusion</tspan></text></g><g class="t2_3"><text x="32" y="420" xml:space="preserve"><tspan class="pur">&#9656; </tspan><tspan class="acc2">assess   </tspan><tspan class="muted"> retry if coverage is weak</tspan></text></g><g class="h2"><text x="32" y="456" xml:space="preserve"><tspan class="grn">&#10003; answer</tspan><tspan class="muted">  extractive · cited excerpt</tspan></text></g><g class="a2_0"><text x="32" y="482" xml:space="preserve">The model never sees the portal —</text></g><g class="a2_1"><text x="32" y="505" xml:space="preserve">deterministic replay runs underneath each</text></g><g class="a2_2"><text x="32" y="528" xml:space="preserve">tool call, and the model reasons only about</text></g><g class="a2_3"><text x="32" y="551" xml:space="preserve">the task and the typed result. [5]</text></g><g class="c2"><text x="32" y="579" class="sm"><tspan class="acc">[5]</tspan><tspan class="muted"> demo/corpus/capability-runtime/README.md</tspan></text><text x="32" y="601" class="sm muted">live at agentic-rag-service-fxsc.onrender.com</text></g></g></svg>

pan class="muted"> broaden and retry if coverage is weak (max 2 rounds)</tspan></text></g><g class="h0"><text x="46" y="340" xml:space="preserve"><tspan class="grn">&#10003; answer</tspan><tspan class="muted">  extractive · excerpt, cited to the retrieved passage</tspan></text></g><g class="a0_0"><text x="46" y="364" xml:space="preserve">The MERGE guards on `cdc_lsn &gt; target.cdc_lsn`, so a stale event re-applied after a newer one is</text></g><g class="a0_1"><text x="46" y="385" xml:space="preserve">ignored. [5]</text></g><g class="c0"><text x="46" y="411"><tspan class="acc">[5]</tspan><tspan class="muted"> demo/corpus/payments-data-platform/README.md &#183; live at agentic-rag-service-fxsc.onrender.com</tspan></text></g></g><g class="s1"><text x="46" y="208"><tspan class="acc">harshit@portfolio</tspan><tspan class="muted">:~$ </tspan></text><text x="216.1" y="208" xml:space="preserve">ask &quot;how are hospital readmissions defined in the Medicare claims project?&quot;</text><g clip-path="url(#tc)"><g class="q1_0"><rect x="216.1" y="194.0" width="629.6" height="22" fill="#010409"/><g class="k1_0"><rect class="cursor" x="216.1" y="196.5" width="8.1" height="15.5" fill="#2dd4bf"/></g></g></g><g class="t1_0"><text x="46" y="240" xml:space="preserve"><tspan class="pur">&#9656; </tspan><tspan class="acc2">plan     </tspan><tspan class="muted"> decompose multi-part questions into sub-queries</tspan></text></g><g class="t1_1"><text x="46" y="262" xml:space="preserve"><tspan class="pur">&#9656; </tspan><tspan class="acc2">retrieve </tspan><tspan class="muted"> vector search per sub-query, top-k 5</tspan></text></g><g class="t1_2"><text x="46" y="284" xml:space="preserve"><tspan class="pur">&#9656; </tspan><tspan class="acc2">fuse     </tspan><tspan class="muted"> reciprocal rank fusion across sub-queries</tspan></text></g><g class="t1_3"><text x="46" y="306" xml:space="preserve"><tspan class="pur">&#9656; </tspan><tspan class="acc2">assess   </tspan><tspan class="muted"> broaden and retry if coverage is weak (max 2 rounds)</tspan></text></g><g class="h1"><text x="46" y="340" xml:space="preserve"><tspan class="grn">&#10003; answer</tspan><tspan class="muted">  extractive · excerpt, cited to the retrieved passage</tspan></text></g><g class="a1_0"><text x="46" y="364" xml:space="preserve">**Readmissions:** an index stay is discharged alive with 30 days of follow-up left in the data, and</text></g><g class="a1_1"><text x="46" y="385" xml:space="preserve">a readmission is any stay starting 1–30 days later. [1]</text></g><g class="c1"><text x="46" y="411"><tspan class="acc">[1]</tspan><tspan class="muted"> demo/corpus/medicare-claims-analytics/README.md &#183; live at agentic-rag-service-fxsc.onrender.com</tspan></text></g></g><g class="s2"><text x="46" y="208"><tspan class="acc">harshit@portfolio</tspan><tspan class="muted">:~$ </tspan></text><text x="216.1" y="208" xml:space="preserve">ask &quot;how does capability-runtime replay a workflow without calling a model?&quot;</text><g clip-path="url(#tc)"><g class="q2_0"><rect x="216.1" y="194.0" width="637.7" height="22" fill="#010409"/><g class="k2_0"><rect class="cursor" x="216.1" y="196.5" width="8.1" height="15.5" fill="#2dd4bf"/></g></g></g><g class="t2_0"><text x="46" y="240" xml:space="preserve"><tspan class="pur">&#9656; </tspan><tspan class="acc2">plan     </tspan><tspan class="muted"> decompose multi-part questions into sub-queries</tspan></text></g><g class="t2_1"><text x="46" y="262" xml:space="preserve"><tspan class="pur">&#9656; </tspan><tspan class="acc2">retrieve </tspan><tspan class="muted"> vector search per sub-query, top-k 5</tspan></text></g><g class="t2_2"><text x="46" y="284" xml:space="preserve"><tspan class="pur">&#9656; </tspan><tspan class="acc2">fuse     </tspan><tspan class="muted"> reciprocal rank fusion across sub-queries</tspan></text></g><g class="t2_3"><text x="46" y="306" xml:space="preserve"><tspan class="pur">&#9656; </tspan><tspan class="acc2">assess   </tspan><tspan class="muted"> broaden and retry if coverage is weak (max 2 rounds)</tspan></text></g><g class="h2"><text x="46" y="340" xml:space="preserve"><tspan class="grn">&#10003; answer</tspan><tspan class="muted">  extractive · excerpt, cited to the retrieved passage</tspan></text></g><g class="a2_0"><text x="46" y="364" xml:space="preserve">The model never sees the portal — deterministic replay runs underneath each tool call, and the model</text></g><g class="a2_1"><text x="46" y="385" xml:space="preserve">reasons only about the task and the typed result. [5]</text></g><g class="c2"><text x="46" y="411"><tspan class="acc">[5]</tspan><tspan class="muted"> demo/corpus/capability-runtime/README.md &#183; live at agentic-rag-service-fxsc.onrender.com</tspan></text></g></g></svg>

orm:none}97.0%,100%{opacity:0}}.ah{animation:ah 18.0s infinite}@keyframes an0{0%,38.89%{opacity:0;transform:translateY(4px)}40.83%,94.0%{opacity:1;transform:none}97.0%,100%{opacity:0}}.an0{animation:an0 18.0s infinite}@keyframes an1{0%,41.39%{opacity:0;transform:translateY(4px)}43.33%,94.0%{opacity:1;transform:none}97.0%,100%{opacity:0}}.an1{animation:an1 18.0s infinite}@keyframes ci{0%,48.33%{opacity:0;transform:translateY(4px)}50.28%,94.0%{opacity:1;transform:none}97.0%,100%{opacity:0}}.ci{animation:ci 18.0s infinite}</style><text x="24" y="58" class="sans" style="font-size:34px;font-weight:700;letter-spacing:-.5px">Harshit Gadge</text><text x="24" y="90" class="sans muted" style="font-size:16px">AI engineer &#183; data engineer &#8212; I build AI and data systems, then measure whether they work.</text><circle cx="31" cy="116" r="4" fill="#1a7f37"/><circle cx="31" cy="116" r="4" fill="none" stroke="#1a7f37" stroke-width="2" class="ring"/><text x="44" y="120.5" class="sans" style="font-size:13.5px"><tspan class="grn" style="font-weight:600">open to work</tspan><tspan class="muted"> &#183; AI Engineer &#183; Data Engineer &#183; Data Scientist</tspan></text><text x="936" y="120.5" text-anchor="end" class="sans muted" style="font-size:13px">MS Data Science, UMD &#183; patent co-inventor</text><rect x="24" y="150" width="912" height="296" rx="10" fill="#ffffff" stroke="#d0d7de"/><path d="M24 160a10 10 0 0 1 10-10h892a10 10 0 0 1 10 10v20h-912z" fill="#f6f8fa"/><line x1="24" y1="180" x2="936" y2="180" stroke="#d0d7de"/><circle cx="42" cy="165" r="5.5" fill="#ff5f57"/><circle cx="60" cy="165" r="5.5" fill="#febc2e"/><circle cx="78" cy="165" r="5.5" fill="#28c840"/><text x="480.0" y="169.5" text-anchor="middle" class="muted" style="font-size:12px">agentic-rag-service &#8212; portfolio Q&amp;A</text><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#0f766e" stop-opacity="0"/><stop offset=".5" stop-color="#0f766e" stop-opacity=".9"/><stop offset="1" stop-color="#0f766e" stop-opacity="0"/></linearGradient><clipPath id="tc"><rect x="24" y="150" width="912" height="296" rx="10"/></clipPath></defs><g clip-path="url(#tc)"><rect class="sweep" x="0" y="179" width="300" height="2" fill="url(#g)"/></g><text x="46" y="208"><tspan class="acc">harshit@portfolio</tspan><tspan class="muted">:~$ </tspan></text><text x="216.1" y="208">ask &quot;how does the payments pipeline ignore a stale, replayed CDC event?&quot;</text><g clip-path="url(#tc)"><g class="typer"><rect x="216.1" y="194" width="603.3" height="20" fill="#ffffff"/><rect class="cursor" x="216.1" y="196" width="8" height="16" fill="#0f766e"/></g></g><g class="tr0"><text x="46" y="240" xml:space="preserve"><tspan class="pur">&#9656; </tspan><tspan class="acc2">plan     </tspan><tspan class="muted"> decompose multi-part questions into sub-queries</tspan></text></g><g class="tr1"><text x="46" y="262" xml:space="preserve"><tspan class="pur">&#9656; </tspan><tspan class="acc2">retrieve </tspan><tspan class="muted"> vector search per sub-query, top-k 5</tspan></text></g><g class="tr2"><text x="46" y="284" xml:space="preserve"><tspan class="pur">&#9656; </tspan><tspan class="acc2">fuse     </tspan><tspan class="muted"> reciprocal rank fusion across sub-queries</tspan></text></g><g class="tr3"><text x="46" y="306" xml:space="preserve"><tspan class="pur">&#9656; </tspan><tspan class="acc2">assess   </tspan><tspan class="muted"> broaden and retry if coverage is weak (max 2 rounds)</tspan></text></g><g class="ah"><text x="46" y="340"><tspan class="grn">&#10003; answer</tspan><tspan class="muted">  extractive &#183; excerpt, cited to the retrieved passage</tspan></text></g><g class="an0"><text x="46" y="364" xml:space="preserve">The MERGE guards on `cdc_lsn &gt; target.cdc_lsn`, so a stale event</text></g><g class="an1"><text x="46" y="385" xml:space="preserve">re-applied after a newer one is ignored.  [5]</text></g><g class="ci"><text x="46" y="412"><tspan class="acc">[5]</tspan><tspan class="muted"> demo/corpus/payments-data-platform/README.md &#183; live at agentic-rag-service-fxsc.onrender.com</tspan></text></g></svg>
